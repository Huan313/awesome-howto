name: 指南选题
description: 提出一个需要可执行步骤的问题
body:
  - type: input
    id: task
    attributes:
      label: 需要完成的任务
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 读者、场景与卡住的步骤
      description: 请移除个人信息、凭据和单位内部数据。
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: 已看过的指南和可公开核对的来源
