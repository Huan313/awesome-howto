name: Dependency review

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base branch or SHA for comparison with the selected ref
        required: true
        type: string

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          base-ref: ${{ github.event.pull_request.base.sha || inputs.base_ref }}
          head-ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fail-on-severity: high
