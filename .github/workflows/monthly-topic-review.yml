name: Monthly topic review

on:
  schedule:
    - cron: '0 9 1 * *'
      timezone: Asia/Shanghai
  workflow_dispatch:
    inputs:
      draft_topic:
        description: Reviewed topic_id, auto, or none
        type: string
        default: auto

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  report:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    outputs:
      topics: ${{ steps.plan.outputs.topics }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.3'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Retrieve recent weekly snapshots from this ref
        env:
          GH_TOKEN: ${{ github.token }}
          HISTORY_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          mkdir -p out/weekly-history
          cutoff=$(date -u -d '30 days ago' +%F)
          if runs=$(gh run list --workflow weekly-topic-scan.yml --branch "$HISTORY_BRANCH" \
            --status success --created ">=$cutoff" --limit 30 --json databaseId,event \
            --jq '.[] | select(.event == "schedule" or .event == "workflow_dispatch") | .databaseId'); then
            while IFS= read -r run_id; do
              [[ "$run_id" =~ ^[0-9]+$ ]] || continue
              gh run download "$run_id" --pattern 'weekly-topic-scan-*' --dir "out/weekly-history/$run_id" \
                || echo "::notice::A prior weekly artifact was unavailable."
            done <<< "$runs"
          else
            echo "::notice::Weekly runs were unavailable. The current scan will continue."
          fi
      - name: Plan topics from the last thirty days
        env:
          HOWTO_GITHUB_TOKEN: ${{ github.token }}
          ENABLE_DOUYIN: ${{ github.ref_name == github.event.repository.default_branch && vars.ENABLE_DOUYIN || '' }}
          DOUYIN_CLIENT_KEY: ${{ github.ref_name == github.event.repository.default_branch && secrets.DOUYIN_CLIENT_KEY || '' }}
          DOUYIN_CLIENT_SECRET: ${{ github.ref_name == github.event.repository.default_branch && secrets.DOUYIN_CLIENT_SECRET || '' }}
          ENABLE_REDDIT: ${{ github.ref_name == github.event.repository.default_branch && vars.ENABLE_REDDIT || '' }}
          REDDIT_ACCESS_TOKEN: ${{ github.ref_name == github.event.repository.default_branch && secrets.REDDIT_ACCESS_TOKEN || '' }}
        run: python -m scripts.run_research monthly --history out/weekly-history --output out/monthly-research
      - name: Check repository guide quality
        run: |
          python -m unittest discover -s tests
          python -m scripts.validate_guides
          python -m scripts.build_index --check
          python -m scripts.check_links
      - name: Upload monthly report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: monthly-topic-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/monthly-research/
          retention-days: 45
          if-no-files-found: warn
      - name: Select an approved editorial brief
        id: plan
        if: github.ref_name == github.event.repository.default_branch && vars.ENABLE_CODEX_AUTOGEN == 'true'
        env:
          HAS_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
          REQUESTED: ${{ inputs.draft_topic || 'auto' }}
        shell: bash
        run: |
          if [[ "$HAS_OPENAI_KEY" != true ]]; then
            echo "::notice::Codex draft skipped. OPENAI_API_KEY is absent."
            exit 0
          fi
          topics=$(python -m scripts.stage_codex_draft choose \
            --requested "$REQUESTED" --selection out/monthly-research/selection.json)
          printf 'topics=%s\n' "$topics" >> "$GITHUB_OUTPUT"

  draft:
    needs: report
    if: needs.report.outputs.topics != '' && needs.report.outputs.topics != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      draft: ${{ steps.codex.outputs.final-message }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.3'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Prepare only repository-reviewed prompt material
        env:
          TOPICS: ${{ needs.report.outputs.topics }}
        run: python -m scripts.stage_codex_draft prompt "$TOPICS" out/codex-prompt.txt
      - name: Generate draft
        id: codex
        uses: openai/codex-action@306c6a196a99dcc6582530c396a19d2672d5e9ec # v1.14
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: out/codex-prompt.txt
          output-schema-file: .github/codex-draft.schema.json
          codex-version: '0.172.0'
          sandbox: workspace-write
          safety-strategy: drop-sudo

  pull-request:
    needs: [report, draft]
    if: needs.draft.outputs.draft != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: codex-draft-${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.3'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate structured draft and regenerate indexes
        env:
          TOPICS: ${{ needs.report.outputs.topics }}
          CODEX_DRAFT: ${{ needs.draft.outputs.draft }}
        run: |
          python -m scripts.stage_codex_draft stage "$TOPICS"
          python -m scripts.validate_guides
          python -m scripts.build_index --check
          python -m scripts.check_links
          bash scripts/ci_tools.sh gitleaks
          out/ci-tools/gitleaks dir --redact --no-banner guides
      - name: Open a draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          branch="automation/codex-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          existing=$(gh pr list --head "$branch" --base "$DEFAULT_BRANCH" --state open --json number --jq 'length')
          if [[ "$existing" != 0 ]]; then
            echo "::notice::A draft pull request already exists for this brief."
            exit 0
          fi
          git add -- guides README.md README_EN.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "docs: draft monthly topics from reviewed evidence"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --draft --base "$DEFAULT_BRANCH" --head "$branch" --title "HowTo 草稿：月度研究 $GITHUB_RUN_ID" \
            --body '请人工核对事实、步骤、适用范围、安全与版权。草稿使用与当月 topic_id 匹配的已审证据包。'
