name: Weekly topic scan

on:
  schedule:
    - cron: '0 9 * * 1'
      timezone: Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  report:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.3'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Scan the last seven days
        env:
          ENABLE_DOUYIN: ${{ github.ref_name == github.event.repository.default_branch && vars.ENABLE_DOUYIN || '' }}
          DOUYIN_CLIENT_KEY: ${{ github.ref_name == github.event.repository.default_branch && secrets.DOUYIN_CLIENT_KEY || '' }}
          DOUYIN_CLIENT_SECRET: ${{ github.ref_name == github.event.repository.default_branch && secrets.DOUYIN_CLIENT_SECRET || '' }}
          ENABLE_REDDIT: ${{ github.ref_name == github.event.repository.default_branch && vars.ENABLE_REDDIT || '' }}
          REDDIT_ACCESS_TOKEN: ${{ github.ref_name == github.event.repository.default_branch && secrets.REDDIT_ACCESS_TOKEN || '' }}
        run: python -m scripts.run_research weekly --output out/weekly-research
      - name: Check repository guide quality
        run: |
          python -m unittest discover -s tests
          python -m scripts.validate_guides
          python -m scripts.build_index --check
          python -m scripts.check_links
      - name: Upload weekly report and observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weekly-topic-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/weekly-research/
          retention-days: 45
          if-no-files-found: warn
